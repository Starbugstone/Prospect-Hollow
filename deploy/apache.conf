<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
        Options -Indexes -ExecCGI
    </Directory>
    LimitRequestBody 1100000
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
