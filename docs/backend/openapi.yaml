              'summary': 'Account, CSRF token and up to three owned town cards',
              'description': 'Each town contains townId, name, revision, updatedAt, isPublic, publicId and summary {era, crest?, coins, buildings, honours}; crest is the town’s validated crest when it has one. Buildings counts positive numeric building levels. saloonCollectedAt is the last time a share-link visitor collected the saloon (milliseconds, 0 if never); the owner game moves its reserved coins once per collection. guest {name, at} | null is the latest signed-in viewer, named after one of their towns after sanitising; the owner game saves it as a VIP and then deletes it. The list never includes full profiles; GET /towns/{id} loads a playable save. Summaries are private to the authenticated owner. account.distinctions maps each player distinction the caller holds now to {at, tenure?} (PlayerDistinction without id): event grants and the time step, both decided by the server; the game only shows them.',
