              'description': 'Newest first, 20 history entries per page. Current visitors are returned on every page. Identity snapshots remain stable after profile changes; publicId is null when the origin town is private/deleted. Present era:null means use the host current era. All timestamps are Unix milliseconds.',
              'parameters':
