                    },
                  'expiresAt': { 'type': ['integer', 'null'] },
                  'serverNow': { 'type': 'integer', 'description': 'Unix milliseconds' },
                },
            },
          'VisitorEntry':
            {
              'type': 'object',
              'properties':
                {
                  'id': { 'type': 'string' },
                  'name':
                    {
                      'type': 'string',
                      'description': 'Empty uses Mayor of town, or Visitor when no town.',
                    },
                  'townName': { 'type': ['string', 'null'] },
                  'era': { 'type': ['string', 'null'] },
                  'publicId': { 'type': ['string', 'null'] },
                  'arrivedAt': { 'type': 'integer', 'description': 'Unix milliseconds' },
                  'lastSeenAt': { 'type': 'integer', 'description': 'Unix milliseconds' },
                  'departedAt': { 'type': ['integer', 'null'] },
                },
            },
          'VisitorGuestbook':
            {
              'type': 'object',
              'properties':
                {
