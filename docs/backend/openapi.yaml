                      'description': 'Time distinction only: whole units since the first sign-in on the server clock, weeks until the first month, months until the first year, then years.',
                      'properties':
                        {
                          'unit': { 'enum': ['week', 'month', 'year'] },
                          'count': { 'type': 'integer', 'minimum': 1 },
                          'next':
                            {
                              'type': 'object',
                              'description': 'GET /account only: the following step {unit, count, at}.',
                            },
                        },
                    },
                },
            },
          'Profile':
            {
              'type': 'object',
              'required': ['schemaVersion', 'town', 'records', 'continuousRecords', 'powers'],
              'properties':
                {
                  'schemaVersion': { 'const': 2 },
                  'town':
                    {
                      'type': 'object',
                      'required': ['era', 'buildings'],
                      'properties':
                        { 'era': { 'type': 'string' }, 'buildings': { 'type': 'object' } },
                    },
                  'records': { 'type': 'object' },
                  'continuousRecords': { 'type': 'object' },
                  'powers': { 'type': 'array' },
                  'integrity': { '$ref': '#/components/schemas/IntegrityJournal' },
                },
              'description': 'Gameplay snapshot, at most 1 MiB excluding queued integrity actions. Town profile uploads allow up to 8 MiB including those actions. Tracked snapshots include semantic resource actions recalculated against the cloud checkpoint. Legacy snapshots establish an unverified migration baseline; puzzle-engine results are not replayed. Validation errors preserve the device copy and last cloud save.',
            },
          'IntegrityJournal':
            {
              'type': 'object',
              'required': ['version', 'epoch', 'baseSequence', 'actions'],
              'properties':
                {
                  'version': { 'const': 1 },
                  'epoch': { 'type': 'string', 'format': 'uuid' },
                  'baseSequence': { 'type': 'integer', 'minimum': 0 },
                  'clientAt':
                    {
                      'type': 'integer',
                      'minimum': 0,
                      'description': 'Device Unix milliseconds captured once when the upload enters its immutable retry queue. Only the first baseline establishes a clock offset, which is never negative: server time is always allowed.',
                    },
                  'actions':
                    {
                      'type': 'array',
                      'items':
                        {
                          'type': 'object',
                          'required': ['id', 'sequence', 'kind', 'data'],
                          'properties':
                            {
                              'id': { 'type': 'string', 'format': 'uuid' },
                              'sequence': { 'type': 'integer', 'minimum': 1 },
                              'kind': { 'type': 'string' },
                              'data': { 'type': 'object' },
                            },
                        },
                    },
                  'context':
                    {
                      'type': 'object',
                      'readOnly': true,
                      'description': 'Server-owned run, clock and money budget context. Incoming client context cannot override the cloud checkpoint.',
                    },
                  'checkpoint':
                    {
                      'type': 'string',
                      'description': 'Opaque server-signed checkpoint retained by the client for historical recovery.',
                    },
                },
            },
          'IntegrityReceipt':
            {
              'type': 'object',
              'required': ['version', 'epoch', 'ackSequence', 'status'],
              'properties':
                {
                  'version': { 'const': 1 },
                  'epoch': { 'type': 'string', 'format': 'uuid' },
                  'ackSequence': { 'type': 'integer', 'minimum': 0 },
                  'status': { 'type': 'string', 'enum': ['baseline', 'tracked'] },
                  'checkpoint': { 'type': 'string' },
                  'moneyBudget': { '$ref': '#/components/schemas/MoneyBudgetCheck' },
                },
            },
          'MoneyBudgetCheck':
            {
              'type': 'object',
              'readOnly': true,
              'description': 'Owner-only server-time plausibility estimate, not proof of cheating. Base coin allowance carries across syncs. Observe mode preserves flagged progress; optional hold mode returns save_money_review and this metadata without changing the cloud save.',
              'properties':
                {
                  'version': { 'const': 1 },
                  'mode': { 'type': 'string', 'enum': ['observe', 'hold'] },
                  'status': { 'type': 'string', 'enum': ['within_estimate', 'review'] },
                  'previousServerAt': { 'type': 'integer', 'minimum': 0 },
                  'serverAt': { 'type': 'integer', 'minimum': 0 },
                  'elapsedMs': { 'type': 'integer', 'minimum': 0 },
                  'carriedCredit': { 'type': 'number', 'minimum': 0 },
                  'carriedDebt': { 'type': 'number', 'minimum': 0 },
                  'replenished': { 'type': 'number', 'minimum': 0 },
                  'newGrossCharge': { 'type': 'number', 'minimum': 0 },
                  'estimatedAllowance': { 'type': 'number' },
                  'debt': { 'type': 'number', 'minimum': 0 },
                  'newMintedCoins': { 'type': 'number', 'minimum': 0 },
                  'newReservedCoins': { 'type': 'number', 'minimum': 0 },
                  'maxMultiplier': { 'type': 'number', 'minimum': 1 },
                },
            },
          'Upload':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['baseRevision', 'uploadId', 'profile'],
              'properties':
                {
                  'baseRevision': { 'type': 'integer', 'minimum': 0 },
                  'uploadId': { 'type': 'string', 'minLength': 16, 'maxLength': 64 },
                  'profile': { '$ref': '#/components/schemas/Profile' },
                },
            },
          'CreateTown':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['baseRevision', 'uploadId', 'profile', 'townId', 'name'],
              'properties':
                {
                  'baseRevision': { 'const': 0 },
                  'uploadId': { 'type': 'string', 'minLength': 16, 'maxLength': 64 },
                  'profile': { '$ref': '#/components/schemas/Profile' },
                  'townId': { 'type': 'string', 'format': 'uuid' },
                  'name': { 'type': 'string', 'minLength': 3, 'maxLength': 24 },
                },
            },
          'Town':
            {
              'type': 'object',
              'required':
                ['townId', 'name', 'revision', 'updatedAt', 'isPublic', 'publicId', 'profile'],
              'properties':
                {
                  'townId': { 'type': 'string', 'format': 'uuid' },
                  'name': { 'type': 'string' },
                  'revision': { 'type': 'integer', 'minimum': 1 },
                  'updatedAt': { 'type': 'integer', 'description': 'Unix seconds' },
                  'isPublic': { 'type': 'boolean' },
                  'publicId': { 'type': 'string', 'pattern': '^[a-f0-9]{32}$' },
                  'distinctions':
                    {
                      'type': 'object',
                      'description': "Owner load and save replies: the caller's player distinctions now, as in GET /account (PlayerDistinction without id, by ID), so a new time step or an admin change reaches the game without a new session.",
                    },
                  'adminReset':
                    {
                      'type': 'boolean',
                      'const': true,
                      'description': 'Present while the current revision is one an admin saved from a sync comparison or an inventory correction: the owner game loads it without asking, keeping its own copy as a recovery backup.',
                    },
                  'profile': { '$ref': '#/components/schemas/Profile' },
                  'integrity': { '$ref': '#/components/schemas/IntegrityReceipt' },
                },
            },
          'Error':
            {
              'type': 'object',
              'properties':
                {
                  'error': { 'type': 'string' },
                  'code': { 'type': 'string' },
                  'field':
                    {
                      'type': 'string',
                      'description': 'Optional field that could not be reconciled; never indicates a ban.',
                    },
                  'cloud': { '$ref': '#/components/schemas/Town' },
                  'moneyBudget': { '$ref': '#/components/schemas/MoneyBudgetCheck' },
                },
            },
        },
    },
}
