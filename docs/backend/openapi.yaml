      '/villages/{publicId}/saloon':
        {
          'post':
            {
              'summary': 'Collect a shared town saloon for its owner, once per hour per town; no account needed',
              'description': 'Stores only the collection time. The owner game moves at most one hour at its current income rate from its reserved saloon coins when it reconnects, leaving the rest stored, so no coins are created. The request body must be an empty JSON object.',
              'security': [],
              'responses':
                {
