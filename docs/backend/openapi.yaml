                                {
                                  'type': 'object',
                                  'additionalProperties': false,
                                  'required': ['levelId', 'score', 'target'],
                                  'description': 'Score family only: the best verified completed puzzle from the floor level and its current star score target.',
                                  'properties':
                                    {
                                      'levelId': { 'type': 'integer', 'minimum': 1 },
                                      'score': { 'type': 'number' },
                                      'target': { 'type': 'number', 'exclusiveMinimum': 0 },
