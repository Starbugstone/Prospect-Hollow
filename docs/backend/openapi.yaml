                ],
            },
          'delete':
            {
              'summary': "Remove a town from the caller's favourites, even if it is no longer shared; body {}",
              'responses':
                {
                  '200': { 'description': 'Success: {favourite: false}' },
                  '401': { 'description': 'Sign in again' },
                  '403': { 'description': 'Origin or CSRF rejected' },
                  '422': { 'description': 'Unexpected fields' },
                  '429': { 'description': 'Rate limited' },
                },
              'parameters':
                [
                  {
                    'name': 'publicId',
