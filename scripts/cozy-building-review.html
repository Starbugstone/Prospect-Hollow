<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cozy landmark review</title>
    <style>
      body {
        margin: 0;
        background: #f2ebda;
        color: #416156;
        font:
          16px Georgia,
          serif;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 14px 22px;
      }
      h1 {
        margin: 0;
        font-size: 25px;
      }
      button,
      select {
        padding: 8px 12px;
        border: 1px solid #bfb28d;
        border-radius: 7px;
        background: #fff6de;
        color: #416156;
        font: inherit;
      }
      button[aria-pressed='true'] {
        background: #dbe6cf;
      }
      p {
        margin: 0;
        font-size: 13px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        padding: 0 18px 18px;
      }
      article {
        min-width: 0;
        height: calc((100vh - 105px) / 2);
        position: relative;
        border: 1px solid #d5ccb8;
        border-radius: 12px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      h2 {
        position: absolute;
        bottom: 11px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 19px;
        margin: 0;
        pointer-events: none;
      }
      .budget {
        position: absolute;
        left: 10px;
        top: 9px;
        font:
          11px system-ui,
          sans-serif;
        color: #5e7167;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="era-label">Canopy Age</h1>
      <button data-era="canopy" aria-pressed="true">Canopy</button>
      <button data-era="riverlight" aria-pressed="false">Riverlight</button>
      <label
        >Building stage
        <select id="stage">
          <option>1</option>
          <option>2</option>
          <option selected>3</option>
        </select></label
      >
      <p>Production geometry · original town daylight · no saved progress changes</p>
    </header>
    <main></main>
    <script type="module" src="./cozy-building-review.js"></script>
  </body>
</html>
