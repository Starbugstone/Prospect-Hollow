name: Quality checks

on:
  pull_request:
    branches: [main, develop, preprod]
  push:
    branches: [main, develop, preprod]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/export-save-rules.mjs --check
      - run: node scripts/create-integrity-fixtures.mjs --check
      - run: npm run verify
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: cascade_test
          POSTGRES_USER: cascade
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cascade -d cascade_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cascade_test
          MYSQL_USER: cascade
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: local-root-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_mysql, intl, mbstring, xml, pcntl
          coverage: none
      - run: npm ci
      - run: node scripts/export-public-content.mjs
      - run: node scripts/export-save-rules.mjs
      - run: composer install --working-dir=backend --no-interaction --prefer-dist
      - name: Static analysis (PHPStan)
        if: matrix.database == 'postgres'
        run: composer analyse --working-dir=backend
      - name: Account and per-town save tests
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://cascade:local-ci-only@127.0.0.1:5432/cascade_test' || 'mysql://cascade:local-ci-only@127.0.0.1:3306/cascade_test?charset=utf8mb4' }}
        run: |
          php backend/tests/moderation.php
          php backend/tests/money-budget.php
          php backend/tests/save-integrity.php
          php backend/bin/migrate.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/saves.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/money-sync.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/visitors.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/honours.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/player-distinctions.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/concurrency.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/release-health.php
          TEST_DATABASE_URL="$DATABASE_URL" php backend/tests/admin.php
      - name: Build and prepare the hosting release
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql://cascade:local-ci-only@127.0.0.1:5432/cascade_test
        run: bash tests/o2switch/build-prospect-test.sh
      - name: Verified deployment controller
        run: |
          php tests/o2switch/deploy-test.php
          php tests/o2switch/health-test.php
          bash tests/o2switch/install-preprod-test.sh
          bash tests/o2switch/install-targets-test.sh
          php tests/o2switch/branch-routing-test.php
      - run: composer audit --working-dir=backend
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_SECRET: container-ci-only-secret-not-for-production-12345
      DB_PASSWORD: container-ci-only-password
      APP_ORIGIN: http://localhost:8094
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: docker compose up -d --build
      - run: docker compose exec -T app php bin/migrate.php
      - name: Check packaged app
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8094/api/v1/health
          curl --fail http://localhost:8094/ > /dev/null
          TEST_HTTP_ORIGIN=http://localhost:8094 php backend/tests/api-http.php
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
